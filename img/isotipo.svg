  <path d="M148 88 q-7 -8 0 -15 q7 -7 0 -14" fill="none" stroke="#FFFDF8" stroke-width="4" stroke-linecap="round" opacity=".95"/>
  <!-- heart window glowing -->
  <path d="M120 152 C104 141 100 131 106 124 C111 118 118 120 120 126 C122 120 129 118 134 124 C140 131 136 141 120 152 Z" fill="#E9A23B"/>
  <!-- door line -->
  <path d="M78 176 H162" stroke="#2F5D62" stroke-width="4" stroke-linecap="round"/>
  <!-- two little figures holding hands (care) -->
  <g fill="#2F5D62">
    <circle cx="52" cy="150" r="6"/>
    <path d="M45 176 v-14 q0 -6 7 -6 q7 0 7 6 v14 z"/>
    <circle cx="188" cy="150" r="6"/>
