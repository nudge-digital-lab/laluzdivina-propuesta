  <circle cx="120" cy="120" r="112" fill="#FBF3E4"/>
  <g stroke="#E9A23B" stroke-width="5" stroke-linecap="round">
    <line x1="120" y1="22" x2="120" y2="42"/>
    <line x1="71" y1="35" x2="81" y2="52"/>
    <line x1="169" y1="35" x2="159" y2="52"/>
    <line x1="35" y1="71" x2="52" y2="81"/>
    <line x1="205" y1="71" x2="188" y2="81"/>
    <line x1="24" y1="120" x2="42" y2="120"/>
    <line x1="216" y1="120" x2="198" y2="120"/>
  </g>
  <circle cx="120" cy="120" r="66" fill="#F6C76A"/>
  <circle cx="120" cy="120" r="52" fill="#F3B44C"/>
  <!-- ground / garden hill -->
  <g clip-path="url(#halo)"><path d="M14 168 Q120 132 226 168 L226 180 Q120 236 14 180 Z" fill="#7FA07A"/>
  <path d="M30 178 Q120 150 210 178 Q170 214 120 216 Q70 214 30 178 Z" fill="#5E8560"/></g>
